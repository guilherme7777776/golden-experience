<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD - Pessoa</title>
  <link rel="stylesheet" href="/funcionario/funcionario.css" />
</head>

<body>
  <header>
    <h1>CRUD Funcionario</h1>
  </header>

  <main>
    <section class="form-section">
      <h2>Cadastro de Funcionários</h2>

      <form id="pessoaForm">
        <div class="search-container">
          <label for="searchId">Buscar por ID:</label>
          <div class="search-input-group">
            <input type="number" id="searchId" placeholder="Digite o ID para buscar" />
            <button type="button" id="btnBuscar">🔍 Buscar</button>

            <button type="button" id="btnIncluir" class="btn-primary">Incluir</button>
            <button type="button" id="btnAlterar" class="btn-secondary" style="display: none;">Alterar</button>
            <button type="button" id="btnExcluir" class="btn-danger" style="display: none;">Excluir</button>
            <button type="button" id="btnSalvar" class="btn-save" style="display: none;">Salvar</button>
            <button type="button" id="btnCancelar" class="btn-cancel">Cancelar</button>
          </div>
        </div>

        <fieldset id="formFields">
          <legend>Dados da Funcionario</legend>

          <!-- Campo oculto para ID (caso queira manter) -->
          <input type="hidden" id="id_pessoa" name="id_pessoa" />

          <div class="form-group">
            <label for="nome_pessoa">Nome:</label>
            <input type="text" id="nome_pessoa" name="nome_pessoa" required />
          </div>

          <div class="form-group">
            <label for="email_pessoa">Email:</label>
            <input type="email" id="email_pessoa" name="email_pessoa" required />
          </div>

          <div class="form-group">
            <label for="senha_pessoa">Senha:</label>
            <input type="password" id="senha_pessoa" name="senha_pessoa" required />
          </div>

          <div class="form-group">
            <label for="endereco_pessoa">Endereço:</label>
            <input type="text" id="endereco_pessoa" name="endereco_pessoa" />
          </div>

          <div class="form-group">
            <label for="telefone_pessoa">Telefone:</label>
            <input type="text" id="telefone_pessoa" name="telefone_pessoa" />
          </div>

          <div class="form-group">
            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" id="data_nascimento" name="data_nascimento" />
          </div>

          <div class="form-group">
            <label for="salario">Salário</label>
            <input type="number" id="salario" name="salario" />
          </div>

          <div class="form-group">
            <label for="carga_horaria">Carga Horária:</label>
            <input type="number" id="carga_horaria" name="carga_horaria" />
          </div>
        </fieldset>
      </form>
    </section>

    <section class="list-section">
      <div class="table-container">
        <table id="pessoasTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Email</th>
              <th>Senha</th>
              <th>Endereço</th>
              <th>Telefone</th>
              <th>Data de Nascimento</th>
              <th>Salário</th>
              <th>Carga Horária</th>
              <th>Cargo</th>
            </tr>
          </thead>
          <tbody id="pessoasTableBody">
            <!-- Dados serão carregados dinamicamente -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 CRUD Pessoa</p>
  </footer>

  <div id="messageContainer" class="message-container"></div>

  <script src="/funcionario/funcionario.js" defer></script>
</body>

</html>
